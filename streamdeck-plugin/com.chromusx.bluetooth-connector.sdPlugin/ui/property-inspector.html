<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bluetooth Device Connector Settings</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background-color: #2d2d2d;
            color: #d4d4d4;
            padding: 16px;
        }

        .container {
            max-width: 400px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-size: 12px;
            font-weight: 500;
            color: #9d9d9d;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .select-row {
            display: flex;
            gap: 8px;
        }

        select {
            width: 100%;
            padding: 8px 12px;
            background-color: #3c3c3c;
            border: 1px solid #5a5a5a;
            border-radius: 4px;
            color: #d4d4d4;
            font-size: 14px;
            outline: none;
            transition: border-color 0.2s;
        }

        select:focus {
            border-color: #0e7afe;
        }

        button {
            flex: 0 0 auto;
            padding: 8px 14px;
            background-color: #3c3c3c;
            border: 1px solid #5a5a5a;
            border-radius: 4px;
            color: #d4d4d4;
            font-size: 16px;
            line-height: 1;
            cursor: pointer;
            transition: background-color 0.2s, border-color 0.2s;
        }

        button:hover {
            background-color: #474747;
            border-color: #0e7afe;
        }

        button:active {
            background-color: #0e7afe;
        }

        .info-text {
            margin-top: 8px;
            font-size: 11px;
            color: #6a6a6a;
            line-height: 1.4;
        }

        [hidden] {
            display: none !important;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="form-group">
            <label for="deviceSelect">Bluetooth Device</label>
            <div class="select-row">
                <select id="deviceSelect">
                    <option value="">Detecting devices…</option>
                </select>
                <button id="refreshBtn" type="button" title="Refresh device list">⟳</button>
            </div>
            <p class="info-text">
                Select the paired device to connect. Don't see it? Pair it in your system Bluetooth settings, then click ⟳.
            </p>
        </div>

        <div class="form-group" id="audioProfileGroup">
            <label for="audioProfileSelect">Audio Profile</label>
            <select id="audioProfileSelect">
                <option value="a2dp">Stereo only (A2DP)</option>
                <option value="a2dp-hfp">Stereo + microphone (A2DP + Hands-Free)</option>
            </select>
            <p class="info-text">
                Stereo only disables the Windows Hands-Free microphone profile, which can reduce playback quality. Changes apply on the next key press.
            </p>
        </div>
    </div>

    <script>
        let websocket = null;
        let pluginUUID = null;
        let actionInfo = {};
        let settings = {};
        let initialSettings = {};
        let latestSettingsRequest = 0;

        const deviceSelect = document.getElementById('deviceSelect');
        const refreshBtn = document.getElementById('refreshBtn');
        const audioProfileGroup = document.getElementById('audioProfileGroup');
        const audioProfileSelect = document.getElementById('audioProfileSelect');

        function normalizeAudioProfile(value) {
            return value === 'a2dp' ? 'a2dp' : 'a2dp-hfp';
        }

        function connectElgatoStreamDeckSocket(inPort, inUUID, inRegisterEvent, inInfo, inActionInfo) {
            pluginUUID = inUUID;
            actionInfo = JSON.parse(inActionInfo);
            initialSettings = { ...(actionInfo.payload.settings || {}) };
            settings = { ...initialSettings };
            audioProfileSelect.value = normalizeAudioProfile(settings.audioProfile);

            // The macOS beta helper controls the whole Bluetooth connection and
            // cannot select individual audio profiles.
            try {
                const streamDeckInfo = JSON.parse(inInfo);
                audioProfileGroup.hidden = streamDeckInfo.application?.platform === 'mac';
            } catch (e) {
                audioProfileGroup.hidden = false;
            }

            websocket = new WebSocket('ws://127.0.0.1:' + inPort);

            websocket.onopen = function () {
                websocket.send(JSON.stringify({ event: inRegisterEvent, uuid: inUUID }));
                requestDevices();
            };

            websocket.onmessage = function (evt) {
                let data;
                try {
                    data = JSON.parse(evt.data);
                } catch (e) {
                    return;
                }
                if (
                    data.event === 'sendToPropertyInspector' &&
                    data.payload &&
                    data.payload.event === 'deviceList'
                ) {
                    populateDevices(data.payload.devices || []);
                } else if (
                    data.event === 'sendToPropertyInspector' &&
                    data.payload &&
                    data.payload.event === 'settingsAccepted'
                ) {
                    const accepted = data.payload.settings || {};
                    const requestId = Number(data.payload.requestId) || 0;
                    const reduced = reduceAcceptedSettings(
                        settings,
                        initialSettings,
                        accepted,
                        requestId,
                        latestSettingsRequest
                    );
                    if (!reduced) return;
                    settings = reduced.settings;
                    initialSettings = reduced.initialSettings;
                    actionInfo.payload.settings = { ...initialSettings };
                }
            };

            websocket.onerror = function (error) {
                console.error('WebSocket Error:', error);
            };
        }

        // Ask the plugin for the list of paired Bluetooth devices.
        function requestDevices() {
            if (!websocket || websocket.readyState !== 1) return;
            deviceSelect.innerHTML = '<option value="">Detecting devices…</option>';
            websocket.send(JSON.stringify({
                event: 'sendToPlugin',
                action: actionInfo.action,
                context: pluginUUID,
                payload: { event: 'getDevices' }
            }));
        }

        // Fill the dropdown with the detected devices, preserving the saved choice.
        function populateDevices(devices) {
            const saved = settings.deviceName || '';
            deviceSelect.innerHTML = '';

            const placeholder = document.createElement('option');
            placeholder.value = '';
            placeholder.textContent = devices.length ? '— Select a device —' : 'No paired devices found';
            deviceSelect.appendChild(placeholder);

            // Keep a previously-saved device visible even if it isn't currently
            // detected, so the persisted choice is never silently lost.
            if (saved && devices.indexOf(saved) === -1) {
                const opt = document.createElement('option');
                opt.value = saved;
                opt.textContent = saved + ' (not detected)';
                opt.selected = true;
                deviceSelect.appendChild(opt);
            }

            devices.forEach(function (name) {
                const opt = document.createElement('option');
                opt.value = name;
                opt.textContent = name;
                if (name === saved) opt.selected = true;
                deviceSelect.appendChild(opt);
            });
        }

        // Persist the selection whenever it changes.
        deviceSelect.addEventListener('change', function () {
            settings.deviceName = deviceSelect.value;
            saveSettings();
        });

        audioProfileSelect.addEventListener('change', function () {
            settings.audioProfile = normalizeAudioProfile(audioProfileSelect.value);
            saveSettings();
        });

        refreshBtn.addEventListener('click', requestDevices);

        function mergeInternalSettings(target, accepted) {
            const merged = { ...target };
            if (accepted && accepted.handoffFromDeviceName) {
                merged.handoffFromDeviceName = accepted.handoffFromDeviceName;
            } else {
                delete merged.handoffFromDeviceName;
            }
            return merged;
        }

        function reduceAcceptedSettings(current, initial, accepted, requestId, latestRequestId) {
            if (requestId > 0) {
                // Only the latest correlated acknowledgement may update public
                // fields. Older replies must not roll a rapid B→C edit back.
                if (requestId !== latestRequestId) return null;
                return {
                    settings: { ...accepted },
                    initialSettings: { ...accepted }
                };
            }

            // Action-time acknowledgements only change the hidden handoff
            // journal; retain the user's current controls.
            return {
                settings: mergeInternalSettings(current, accepted),
                initialSettings: mergeInternalSettings(initial, accepted)
            };
        }

        function saveSettings() {
            if (websocket && websocket.readyState === 1) {
                latestSettingsRequest += 1;
                websocket.send(JSON.stringify({
                    event: 'sendToPlugin',
                    action: actionInfo.action,
                    context: pluginUUID,
                    payload: {
                        event: 'updateSettings',
                        settings: {
                            deviceName: settings.deviceName || '',
                            audioProfile: normalizeAudioProfile(settings.audioProfile)
                        },
                        initialSettings: { ...initialSettings },
                        requestId: latestSettingsRequest
                    }
                }));
            }
        }
    </script>
</body>
</html>
